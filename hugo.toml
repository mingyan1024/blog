baseURL = 'https://gaomian.org'
languageCode = 'zh-cn'
title = '高勉的技术分享 | 专注分享ai及其它IT领域的干货'
theme = "PaperMod"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[services]
  [services.googleAnalytics]
    ID = "G-QHMXZN4MX8"  # 替换成你的衡量 ID

[params.profileMode]
  enabled = false

[params.homeInfoParams]  
  Title = "您好，欢迎来到高勉的技术分享 👋"
  Content = "本网站分享IT技术内容；导航栏-文章分类，可根据类目搜索文章；导航栏-搜索，可根据关键词搜索文章"

[pagination]
  pagerSize = 5


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  author = "高勉"
  description = "高勉的技术博客，专注分享 AI、Web 开发、App 开发领域的实用教程与技术思考，帮助开发者少走弯路。"
  ShowToc = true
  assets.favicon = "/favicon.ico"
  ShowCodeCopyButtons = true

[author]
  name = "高勉"

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 1

  [[menu.main]]
  name = "文章分类"
  url = "/categories/"
  weight = 2


    [[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 3

  [[menu.main]]
    name = "联系我"
    url = "/about/"
    weight = 4


  [[menu.main]]
    name = "Privacy (EN)"
    url = "/privacy/"
    weight = 5

  [[menu.main]]
    name = "隐私政策 (CN)"
    url = "/privacy-cn/"
    weight = 6
  

  
